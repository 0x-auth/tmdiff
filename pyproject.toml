[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmdiff"
version = "0.2.3"
description = "git diff for chat exports and logs — 100% offline, zero LLMs, pure arithmetic."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abhishek Srivastava", email = "bitsabhi@gmail.com" }]
requires-python = ">=3.9"
keywords = ["diff", "timeline", "snowflake", "causality", "logs", "archaeology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/0x-auth/tmdiff"
Repository = "https://github.com/0x-auth/tmdiff"

[project.scripts]
tmdiff = "tmdiff.cli:main"
